name: "Test Golden Container"

on:
  workflow_dispatch:

jobs: 
  test_runner:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mahdikaibi/videocreator-runner:v1.0

    steps:
      - name: Check Environment and Boot Speed
        run: |
          echo "=== 1. Python Version ==="
          python --version
          echo "=== 2. FFmpeg and FFprobe ==="
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
          echo "=== 3. Ollama ==="
          ollama --version
          echo "=== 4. Instant AI and Media Engine Imports ==="
          python -c "import numpy; print('NumPy version:', numpy.__version__); import torch, whisperx, faster_whisper, librosa, seleniumbase, g4f, google.genai, nodriver, bing_image_downloader, fastapi, rembg, imagehash; print('🚀 ALL ENGINES LOADED IN ZERO SECONDS!')"
          echo "=== 5. Xvfb and Display Check ==="
          xvfb-run -a python -c "print('Xvfb virtual display active and functional!')"
          echo "=== 6. Browser Verification ==="
          firefox --version
          echo "=== 7. Qwen3-TTS Model Weights Verification ==="
          python -c "import os; cache = os.path.join(os.environ.get('HF_HOME', '/opt/huggingface'), 'hub', 'models--Qwen--Qwen3-TTS-12Hz-1.7B-Base'); assert os.path.isdir(cache), f'Missing {cache}'; print('✅ Qwen3-TTS Model Weights Verified at:', cache)"
          echo "=== 8. Qwen-TTS & pkg_resources Verification ==="
          python -c "import pkg_resources, qwen_tts; print('✅ Qwen-TTS and pkg_resources Verified!')"


