name: "Build Golden Container Image"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "[*] Freeing disk space before Docker build..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/videocreator-runner"
          TAG="${{ inputs.tag }}"
          
          echo "=========================================="
          echo "Target Image: ${IMAGE_NAME}:${TAG}"
          echo "=========================================="
          
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:latest" \
            .
            
          echo "[*] Pushing ${IMAGE_NAME}:${TAG} to GHCR..."
          docker push "${IMAGE_NAME}:${TAG}"
          
          echo "[*] Pushing ${IMAGE_NAME}:latest to GHCR..."
          docker push "${IMAGE_NAME}:latest"
          
          echo "=========================================="
          echo "[+] Successfully published golden runner image:"
          echo "    ${IMAGE_NAME}:${TAG}"
          echo "    ${IMAGE_NAME}:latest"
          echo "=========================================="
